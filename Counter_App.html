<!DOCTYPE html>
<html>

<head>
    <title>Addition</title>
    <style>
        body {
            background-image: linear-gradient(to top right, white, aqua, blue, darkblue, black);
            height: 95vh;
            background-repeat: no-repeat;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            margin-top: 30px;
            font-size: 5vh;
        }
        input {
            width: 35vh;
            padding: 5px;
            margin: 2px;
            height: 3vh;
        }
        #Number {
            font-weight: bolder;
        }
        button {
            cursor: pointer;
            border-radius: 6px;
            padding: 5px;
            width: 45px;
            margin: 3px;
            height: 5vh;
            font-size: 30px;
            box-shadow: 0 0 25px purple;
        }
        button:hover {
            box-shadow: 0 0 25px inset purple;
        }  
    </style>
</head>
<body>
    <div>
        <h4>Press the buttons to add or subtract</h4>
        <p id="Number">0</p>
        <button id="add"> + </button>
        <button id="subtract"> - </button><br>
        <input type="number" id="inputadd" placeholder="Enter a number to add"><br>
        <input type="number" id="inputsubtract" placeholder="Enter a number to subtract"><br>
    </div>

    <script>
        var number = 0;
        var add = document.getElementById("add");
        var subtract = document.getElementById("subtract");
        var inputadd = document.getElementById("inputadd");
        var inputsubtract = document.getElementById("inputsubtract");

        add.onclick = function () {
            number = number + Number(inputadd.value);
            if (inputadd.value === "") {
                alert("Please enter a number!!!")
            }
            document.getElementById("Number").innerHTML = number;
        }

        subtract.onclick = function () {
            number = number - Number(inputsubtract.value);
            if (inputsubtract.value === "") {
               alert("Please enter a number!!!")
            }
            document.getElementById("Number").innerHTML = number;
        }
    </script>
</body>
