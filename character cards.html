<!DOCTYPE html>
<html>

<head>
    <title>Cards</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"> </script>
    <style>
       h1 {
        color: darkblue;
        font-family: monospace;
        font-size: 30px;
        font-weight: bold;
        
       }

       img {
        height: 500px;
        width: 300px;
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
       }

       body {
        background: lightseagreen;
        text-align: center;
       }

       .card {
        border: 5px, solid, black;
        background-color: lightgrey;
        justify-content: center;
        align-items: center;
        text-align: left;
       }

       h5 {
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        font-size: 28px;
       }

       p {
        font-weight: lighter;
        font-family: Tahoma, Verdana, sans-serif;
        font-size: large;
        color: rgb(85, 101, 101);
       }

       button {
        cursor: pointer;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: 18px;
        background: rgb(137, 188, 219);
        border-radius: 10px;
       }
    </style>
</head>
<body>
    <h1>Character Profile</h1>
    <div class="container">
        <div class="card">
            <img src="batman.png" alt="card image">
            <div class="card-body">
                <h5>Batman</h5>
                <p>World's Greatest Detective</p>
                <button>See Character</button>
            </div>
        </div>
    </div>
</body>
</html>
